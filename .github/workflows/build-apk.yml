                  android:startColor="#1E1B4B"
                  android:centerColor="#312E81"
                  android:endColor="#4F46E5" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#22C7D2FE"
                  android:pathData="M54,54m-34,0a34,34 0 1,1 68,0a34,34 0 1,1 -68,0" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M33,45 L75,45 C76.5,45 77.8,46.1 78,47.6 L81,77 C81.2,78.7 79.9,80 78.2,80 L29.8,80 C28.1,80 26.8,78.7 27,77 L30,47.6 C30.2,46.1 31.5,45 33,45 Z" />
              <path
                  android:fillColor="#E0E7FF"
                  android:pathData="M33,45 L75,45 L73,50 L35,50 Z" />
              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="3.5"
                  android:strokeLineCap="round"
                  android:fillColor="#00000000"
                  android:pathData="M44,45 C44,35 64,35 64,45" />
              <path
                  android:strokeColor="#6366F1"
                  android:strokeWidth="2.5"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"
                  android:fillColor="#00000000"
                  android:pathData="M54,53 C54,50 56,49 57,51 C57.8,52.5 56.5,54 54,56 L42,66 L66,66 Z" />
              <path
                  android:fillColor="#FBBF24"
                  android:pathData="M73,32 L75,37 L80,39 L75,41 L73,46 L71,41 L66,39 L71,37 Z" />
              <path
                  android:fillColor="#FBCFE8"
                  android:pathData="M30,38 L31.5,41.5 L35,43 L31.5,44.5 L30,48 L28.5,44.5 L25,43 L28.5,41.5 Z" />
          </vector>
          EOF

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Generar APK de Android
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace -Djava.awt.headless=true
          else
            gradle assembleDebug --no-daemon --stacktrace -Djava.awt.headless=true
          fi

      - name: Localizar y preparar archivo APK
        id: prepare_apk
        run: |
          TAG="${{ github.event.inputs.version_tag || github.ref_name }}"
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No se encontró ningún archivo APK generado"
            exit 1
          fi
          TARGET_NAME="cailin_store_${TAG}.apk"
          cp "$APK_PATH" "$TARGET_NAME"
          echo "apk_path=$TARGET_NAME" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "APK preparado: $TARGET_NAME"

      - name: Crear Release en GitHub y adjuntar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.tag_name }}
          name: CAILIN STORE ${{ steps.prepare_apk.outputs.tag_name }}
          body: |
            ## Versión Oficial CAILIN STORE (Tienda de Ropa)
            - Compilación oficial generada en GitHub Actions.
            - Versión: ${{ steps.prepare_apk.outputs.tag_name }}
            - Descarga e instala en tu teléfono Android o terminal POS.
          files: ${{ steps.prepare_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
